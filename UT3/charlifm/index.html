<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>charli.fm - Inicio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&amp;family=IBM+Plex+Serif&amp;display=swap">
  <link rel="stylesheet" href="css/estructura.css">
  <link rel="stylesheet" href="css/moodboard.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body>

  <header class="cabecera">
    <a class="logo" href="index.html">charli.fm</a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="buscar.html">Buscar emisoras</a>
      <a href="anadir.html">Añadir estación</a>
    </nav>
  </header>

  <main>
    <h1>Escucha tus emisoras favoritas</h1>
    <p>Descubre y escucha radios de todo el mundo</p>

    <input class="buscador" type="text" placeholder="Introduce aqui la emisora">

    <section class="recomendadas">
      <h2>Emisoras recomendadas</h2>

      <article class="tarjeta">
        <img src="img/radio1-400.jpg" srcset="img/radio1-400.jpg 400w, img/radio1-800.jpg 800w" sizes="200px" alt="Pared de radios antiguas apiladas con los diales iluminados">
        <h3>Radio 1</h3>
        <a class="escuchar" href="buscar.html">▶ Escuchar</a>
      </article>

      <article class="tarjeta">
        <img src="img/radio2-400.jpg" srcset="img/radio2-400.jpg 400w, img/radio2-800.jpg 800w" sizes="200px" alt="Radios antiguas apiladas en blanco y negro">
        <h3>Radio 2</h3>
        <a class="escuchar" href="buscar.html">▶ Escuchar</a>
      </article>

      <article class="tarjeta">
        <img src="img/radio3-400.jpg" srcset="img/radio3-400.jpg 400w, img/radio3-800.jpg 800w" sizes="200px" alt="Radios retro de madera apiladas en una tienda con luz cálida">
        <h3>Radio 3</h3>
        <a class="escuchar" href="buscar.html">▶ Escuchar</a>
      </article>
    </section>

    <section class="reproductor">
      <h2>Prueba de audio</h2>
      <audio controls>
        <source src="media/muestra.mp3" type="audio/mpeg">
        <source src="media/muestra.ogg" type="audio/ogg">
        Tu navegador no soporta audio.
      </audio>
    </section>
  </main>

  <footer>
    <a href="index.html">charli.fm</a>
    <a href="nosotros.html">Sobre nosotros</a>
    <a href="contacto.html">Contacto</a>
    <a href="privacidad.html">Política de privacidad</a>
    <p>
      <a href="https://jigsaw.w3.org/css-validator/check/referer">
        <img style="border:0;width:88px;height:31px"
          src="img/vcss-blue.png"
          alt="¡CSS Válido!" />
      </a>
    </p>
  </footer>

</body>
</html>
